name: CD - Kubernetes Deployment

on:
  workflow_run:
    workflows:
      - "CI - Build and Test"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Kubernetes cluster
        run: kubectl get nodes

      - name: Apply Kubernetes namespace
        run: kubectl apply -f kubernetes/namespace.yaml

      - name: Deploy Backend
        run: |
          kubectl apply -f kubernetes/backend-deployment.yaml
          kubectl apply -f kubernetes/backend-service.yaml

      - name: Deploy Users Service
        run: |
          kubectl apply -f kubernetes/users-deployment.yaml
          kubectl apply -f kubernetes/users-service.yaml

      - name: Deploy Frontend
        run: |
          kubectl apply -f kubernetes/frontend-deployment.yaml
          kubectl apply -f kubernetes/frontend-service.yaml

      - name: Verify deployment
        run: kubectl get pods -n microservices