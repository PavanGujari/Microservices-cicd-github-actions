name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Test Backend
        run: |
          pytest backend/test_app.py

      - name: Install Users Service dependencies
        run: |
          pip install -r users-service/requirements.txt

      - name: Test Users Service
        run: |
          pytest users-service/test_app.py

  build-and-push:
    needs: test
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: pavangujari/backend:latest

      - name: Build and Push Users Service
        uses: docker/build-push-action@v6
        with:
          context: ./users-service
          push: true
          tags: pavangujari/users-service:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: pavangujari/frontend:latest